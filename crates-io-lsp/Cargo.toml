[package]
name = "crates-io-lsp"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"

[dependencies]
cargo-manifest = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.2+spec-1.1.0"
reqwest = { version = "0.13" }
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
tower-lsp-server = "0.23"
tokio = { version = "1.52", features = ["full"] }
